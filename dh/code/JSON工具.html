
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化与压缩工具</title>
    <link href="./ggcss/tailwind.min.css" rel="stylesheet">
    <link rel="./ggcss/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">JSON工具</h1>
            <p class="text-gray-600">格式化和压缩JSON数据</p>
        </div>

        <!-- 功能按钮 -->
        <div class="flex justify-center space-x-4 mb-6">
            <button onclick="setMode('format')" id="format-btn" class="px-6 py-2 bg-blue-500 text-white rounded-lg font-medium hover:bg-blue-600 transition">
                <i class="fas fa-indent mr-2"></i>格式化
            </button>
            <button onclick="setMode('minify')" id="minify-btn" class="px-6 py-2 bg-green-500 text-white rounded-lg font-medium hover:bg-green-600 transition">
                <i class="fas fa-compress-alt mr-2"></i>压缩
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 输入区域 -->
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-700">输入</h2>
                    <div class="space-x-2">
                        <button onclick="clearInput()" class="text-sm px-3 py-1 bg-red-100 text-red-600 rounded hover:bg-red-200">
                            清空
                        </button>
                        <button onclick="loadSample()" class="text-sm px-3 py-1 bg-blue-100 text-blue-600 rounded hover:bg-blue-200">
                            示例
                        </button>
                    </div>
                </div>
                <textarea id="input" placeholder="请输入JSON数据..." class="w-full h-64 p-3 border border-gray-300 rounded font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- 输出区域 -->
            <div class="bg-white rounded-lg shadow-md p-4">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-gray-700">输出</h2>
                    <button onclick="copyOutput()" class="text-sm px-3 py-1 bg-green-100 text-green-600 rounded hover:bg-green-200">
                        <i class="fas fa-copy mr-1"></i>复制
                    </button>
                </div>
                <textarea id="output" readonly class="w-full h-64 p-3 border border-gray-300 rounded font-mono text-sm bg-gray-50"></textarea>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="text-center mt-6">
            <button onclick="processJSON()" class="px-8 py-3 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition shadow-lg">
                <i class="fas fa-cogs mr-2"></i>开始处理
            </button>
        </div>

        <!-- 状态提示 -->
        <div id="message" class="mt-4 text-center hidden">
            <div id="success-msg" class="inline-block px-4 py-2 bg-green-100 text-green-700 rounded">
                <i class="fas fa-check-circle mr-2"></i><span id="success-text"></span>
            </div>
            <div id="error-msg" class="inline-block px-4 py-2 bg-red-100 text-red-700 rounded hidden">
                <i class="fas fa-exclamation-triangle mr-2"></i><span id="error-text"></span>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'format';

        function setMode(mode) {
            currentMode = mode;
            const formatBtn = document.getElementById('format-btn');
            const minifyBtn = document.getElementById('minify-btn');
            
            if (mode === 'format') {
                formatBtn.classList.add('bg-blue-600');
                formatBtn.classList.remove('bg-blue-500');
                minifyBtn.classList.add('bg-green-500');
                minifyBtn.classList.remove('bg-green-600');
            } else {
                minifyBtn.classList.add('bg-green-600');
                minifyBtn.classList.remove('bg-green-500');
                formatBtn.classList.add('bg-blue-500');
                formatBtn.classList.remove('bg-blue-600');
            }
        }

        function loadSample() {
            const sample = {
                "name": "张三",
                "age": 25,
                "city": "北京",
                "skills": ["JavaScript", "Python", "HTML"],
                "address": {
                    "street": "长安街1号",
                    "zipcode": "100000"
                }
            };
            document.getElementById('input').value = JSON.stringify(sample);
        }

        function clearInput() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            hideMessage();
        }

        function showMessage(type, text) {
            const messageDiv = document.getElementById('message');
            const successMsg = document.getElementById('success-msg');
            const errorMsg = document.getElementById('error-msg');
            
            if (type === 'success') {
                document.getElementById('success-text').textContent = text;
                successMsg.classList.remove('hidden');
                errorMsg.classList.add('hidden');
            } else {
                document.getElementById('error-text').textContent = text;
                errorMsg.classList.remove('hidden');
                successMsg.classList.add('hidden');
            }
            messageDiv.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }

        function copyOutput() {
            const output = document.getElementById('output');
            if (!output.value.trim()) {
                showMessage('error', '没有内容可复制');
                return;
            }
            output.select();
            document.execCommand('copy');
            showMessage('success', '已复制到剪贴板');
            setTimeout(hideMessage, 2000);
        }

        function processJSON() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                showMessage('error', '请输入JSON数据');
                return;
            }

            try {
                const parsed = JSON.parse(input);
                if (currentMode === 'format') {
                    document.getElementById('output').value = JSON.stringify(parsed, null, 2);
                } else {
                    document.getElementById('output').value = JSON.stringify(parsed);
                }
                showMessage('success', '处理完成');
            } catch (e) {
                showMessage('error', 'JSON格式错误: ' + e.message);
            }
        }

        // 初始化
        setMode('format');
    </script>
</body>
</html>
