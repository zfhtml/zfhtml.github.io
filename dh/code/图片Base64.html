<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片与Base64互转工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); overflow: hidden; }
        header { background: linear-gradient(120deg, #3a7bd5, #00d2ff); color: white; padding: 22px; text-align: center; }
        h1 { font-size: 26px; margin-bottom: 8px; }
        .description { opacity: 0.9; font-size: 15px; }
        .tab-container { display: flex; border-bottom: 1px solid #edf2f7; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 500; transition: all 0.3s; }
        .tab.active { color: #3a7bd5; border-bottom: 3px solid #3a7bd5; }
        .tab-content { padding: 25px; display: none; }
        .tab-content.active { display: block; }
        input[type="file"] { margin: 10px 0; }
        .preview { max-width: 100%; margin: 15px 0; border: 1px solid #ddd; padding: 5px; border-radius: 4px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; resize: vertical; }
        .btn { padding: 8px 16px; background: #3a7bd5; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; transition: background 0.3s; }
        .btn:hover { background: #2a6bc1; }
        .download-link { display: inline-block; margin-top: 10px; color: #3a7bd5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>图片与Base64互转工具</h1>
            <p class="description">支持图片转Base64编码、Base64编码还原为图片，本地处理更安全</p>
        </header>
        
        <div class="tab-container">
            <div class="tab active" data-tab="img-to-base64">图片转Base64</div>
            <div class="tab" data-tab="base64-to-img">Base64转图片</div>
        </div>

        <!-- 图片转Base64 -->
        <div class="tab-content active" id="img-to-base64">
            <h3>上传图片生成Base64编码</h3>
            <input type="file" id="imgUpload" accept="image/*">
            <div>
                <h4>图片预览：</h4>
                <img id="imgPreview" class="preview" alt="预览图">
            </div>
            <div>
                <h4>Base64编码：</h4>
                <textarea id="imgToBase64Result" placeholder="上传图片后生成的Base64编码将显示在这里..."></textarea>
            </div>
            <button class="btn" onclick="copy('imgToBase64Result')">复制编码</button>
        </div>

        <!-- Base64转图片 -->
        <div class="tab-content" id="base64-to-img">
            <h3>粘贴Base64编码还原图片</h3>
            <textarea id="base64Input" placeholder="请粘贴Base64编码..."></textarea>
            <button class="btn" onclick="convertBase64ToImg()">转换图片</button>
            <div>
                <h4>图片预览：</h4>
                <img id="base64Preview" class="preview" alt="预览图">
            </div>
            <a id="downloadLink" class="download-link" download="base64-image.png">下载图片</a>
        </div>
    </div>

    <script>
        // 切换标签页
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // 图片转Base64
        document.getElementById('imgUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('imgPreview').src = event.target.result;
                document.getElementById('imgToBase64Result').value = event.target.result;
            };
            reader.readAsDataURL(file); // 将图片转为Base64编码‌:ml-citation{ref="1" data="citationList"}
        });

        // 复制功能
        function copy(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            alert('复制成功！');
        }

        // Base64转图片
        function convertBase64ToImg() {
            const base64Code = document.getElementById('base64Input').value.trim();
            if (!base64Code) { alert('请输入Base64编码'); return; }
            // 验证Base64格式
            if (!/^data:image\/\w+;base64,/.test(base64Code)) {
                alert('请输入正确的Base64图片编码（需包含data:image前缀）');
                return;
            }
            const preview = document.getElementById('base64Preview');
            const downloadLink = document.getElementById('downloadLink');
            preview.src = base64Code;
            downloadLink.href = base64Code; // 设置下载链接‌:ml-citation{ref="4" data="citationList"}
        }
    </script>

</body>
</html>
