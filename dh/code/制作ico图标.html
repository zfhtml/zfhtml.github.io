<body>
<header id="header"></header>
<main class="tb-container">

<section class="nk-content nk-content-fluid">
<div class="card card-preview category-card">
<div class="card-inner">
   <div class="nya-title nk-ibx-action-item progress-rating"><span class="nk-menu-text font-weight-bold">在线制作ico图标</span></div>
<section class="container">

<div class="panel">

<div class="mb-4">
    <div class="file-input-wrapper">
        <button class="btn btn-warning w-100 py-3">
            <i class="fa fa-folder-open me-2"></i>选择图片...
        </button>
        <input type="file" id="imageUpload" accept="image/*">
    </div>
    <div id="fileInfo" class="mt-2 text-muted"></div>
    <div class="progress" id="progressBar" style="display: none;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
    </div>
</div>

<div class="preview-container" id="previewContainer">
    <h5>图片预览</h5>
    <img id="previewImage" class="preview-image" src="" alt="预览图片">
</div>

<div class="form-group mb-4">
    <label class="form-label fw-bold">目标尺寸：</label>
    <div class="d-flex flex-wrap">
        <div class="dimension-option">
            <input type="radio" id="size16" name="image_dimensions" value="16">
            <label for="size16">16 x 16</label>
        </div>
        <div class="dimension-option">
            <input type="radio" id="size32" name="image_dimensions" value="32" checked>
            <label for="size32">32 x 32</label>
        </div>
        <div class="dimension-option">
            <input type="radio" id="size48" name="image_dimensions" value="48">
            <label for="size48">48 x 48</label>
        </div>
        <div class="dimension-option">
            <input type="radio" id="size64" name="image_dimensions" value="64">
            <label for="size64">64 x 64</label>
        </div>
        <div class="dimension-option">
            <input type="radio" id="size128" name="image_dimensions" value="128">
            <label for="size128">128 x 128</label>
        </div>
    </div>
</div>

<div class="text-center">
    <button id="generateBtn" class="btn btn-warning" disabled>
        <i class="fa fa-magic me-2"></i>生成ICO图标
    </button>
</div>

<div class="result-container" id="resultContainer">
    <h4><i class="fa fa-check-circle text-success me-2"></i>完成!</h4>
    <p>您的ICO图标已生成成功，点击下方按钮下载</p>
    <a id="downloadLink" class="btn btn-success mt-2">
        <i class="fa fa-download me-2"></i>下载ICO图标
    </a>
    <div class="mt-3">
        <small class="text-muted">下载后请将文件重命名为 favicon.ico 并上传到您的网站根目录</small>
    </div>
</div>

</div>

<div id="tui"></div>
</section>
</div>
</div>
</section>
<footer id="footer"></footer>
</main>

<script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageUpload = document.getElementById('imageUpload');
            const fileInfo = document.getElementById('fileInfo');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');
            const generateBtn = document.getElementById('generateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const downloadLink = document.getElementById('downloadLink');
            const progressBar = document.getElementById('progressBar');
            const progressBarInner = progressBar.querySelector('.progress-bar');
            
            // ICO文件头结构
            class ICOGenerator {
                constructor() {
                    this.images = [];
                }
                
                addImage(canvas) {
                    this.images.push(canvas);
                }
                
                generate() {
                    // ICO文件结构:
                    // 1. ICO文件头 (6字节)
                    // 2. 图标目录项 (每个16字节)
                    // 3. 图标数据
                    
                    const headerSize = 6;
                    const directoryEntrySize = 16;
                    let offset = headerSize + (this.images.length * directoryEntrySize);
                    
                    // 创建ICO文件头
                    const header = new ArrayBuffer(headerSize);
                    const headerView = new DataView(header);
                    headerView.setUint16(0, 0, true); // 保留字段，必须为0
                    headerView.setUint16(2, 1, true); // 图标类型，1为ICO
                    headerView.setUint16(4, this.images.length, true); // 图标数量
                    
                    // 创建目录项和数据
                    const directories = [];
                    const imageData = [];
                    
                    for (let i = 0; i < this.images.length; i++) {
                        const canvas = this.images[i];
                        const size = canvas.width;
                        
                        // 将canvas转换为PNG
                        const pngData = this.canvasToPNG(canvas);
                        
                        // 创建目录项
                        const directory = new ArrayBuffer(directoryEntrySize);
                        const directoryView = new DataView(directory);
                        
                        directoryView.setUint8(0, size === 256 ? 0 : size); // 宽度
                        directoryView.setUint8(1, size === 256 ? 0 : size); // 高度
                        directoryView.setUint8(2, 0); // 颜色数 (0表示超过256色)
                        directoryView.setUint8(3, 0); // 保留字段
                        directoryView.setUint16(4, 1, true); // 颜色平面数
                        directoryView.setUint16(6, 32, true); // 每像素位数
                        directoryView.setUint32(8, pngData.length, true); // 图像数据大小
                        directoryView.setUint32(12, offset, true); // 图像数据偏移量
                        
                        directories.push(directory);
                        imageData.push(pngData);
                        
                        offset += pngData.length;
                    }
                    
                    // 合并所有数据
                    let totalSize = header.byteLength;
                    directories.forEach(dir => totalSize += dir.byteLength);
                    imageData.forEach(img => totalSize += img.length);
                    
                    const icoData = new Uint8Array(totalSize);
                    let currentOffset = 0;
                    
                    // 添加文件头
                    icoData.set(new Uint8Array(header), currentOffset);
                    currentOffset += header.byteLength;
                    
                    // 添加目录项
                    directories.forEach(dir => {
                        icoData.set(new Uint8Array(dir), currentOffset);
                        currentOffset += dir.byteLength;
                    });
                    
                    // 添加图像数据
                    imageData.forEach(img => {
                        icoData.set(img, currentOffset);
                        currentOffset += img.length;
                    });
                    
                    return icoData;
                }
                
                canvasToPNG(canvas) {
                    // 将canvas转换为PNG格式的Uint8Array
                    const dataURL = canvas.toDataURL('image/png');
                    const binary = atob(dataURL.split(',')[1]);
                    const array = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        array[i] = binary.charCodeAt(i);
                    }
                    return array;
                }
            }
            
            // 文件选择事件
            imageUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const file = this.files[0];
                    const fileName = file.name;
                    const fileSize = (file.size / 1024).toFixed(2);
                    
                    // 显示文件信息
                    fileInfo.innerHTML = `已选择: ${fileName} (${fileSize} KB)`;
                    
                    // 显示加载进度
                    progressBar.style.display = 'block';
                    progressBarInner.style.width = '30%';
                    
                    // 显示图片预览
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        previewContainer.style.display = 'block';
                        progressBarInner.style.width = '100%';
                        
                        setTimeout(() => {
                            progressBar.style.display = 'none';
                        }, 500);
                    };
                    reader.readAsDataURL(file);
                    
                    // 启用生成按钮
                    generateBtn.disabled = false;
                }
            });
            
            // 生成ICO图标
            generateBtn.addEventListener('click', function() {
                if (!imageUpload.files || !imageUpload.files[0]) {
                    alert('请先选择一张图片！');
                    return;
                }
                
                const selectedSize = document.querySelector('input[name="image_dimensions"]:checked').value;
                const file = imageUpload.files[0];
                
                // 显示加载状态
                generateBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>生成中...';
                generateBtn.disabled = true;
                progressBar.style.display = 'block';
                progressBarInner.style.width = '30%';
                
                // 创建图片元素
                const img = new Image();
                img.onload = function() {
                    progressBarInner.style.width = '60%';
                    
                    // 创建Canvas并调整尺寸
                    const canvas = document.createElement('canvas');
                    const size = parseInt(selectedSize);
                    canvas.width = size;
                    canvas.height = size;
                    
                    const ctx = canvas.getContext('2d');
                    
                    // 绘制图像（保持比例，居中显示）
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const x = (canvas.width - img.width * scale) / 2;
                    const y = (canvas.height - img.height * scale) / 2;
                    
                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                    
                    progressBarInner.style.width = '80%';
                    
                    // 生成ICO
                    const icoGenerator = new ICOGenerator();
                    icoGenerator.addImage(canvas);
                    const icoData = icoGenerator.generate();
                    
                    // 创建下载链接
                    const blob = new Blob([icoData], {type: 'image/x-icon'});
                    const url = URL.createObjectURL(blob);
                    
                    downloadLink.href = url;
                    downloadLink.download = `favicon-${selectedSize}x${selectedSize}.ico`;
                    
                    // 显示结果
                    resultContainer.style.display = 'block';
                    progressBarInner.style.width = '100%';
                    
                    // 恢复按钮状态
                    generateBtn.innerHTML = '<i class="fa fa-magic me-2"></i>生成ICO图标';
                    generateBtn.disabled = false;
                    
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                    }, 500);
                    
                    // 滚动到结果区域
                    resultContainer.scrollIntoView({ behavior: 'smooth' });
                };
                
                img.src = URL.createObjectURL(file);
            });
        });
    </script>
</body>
